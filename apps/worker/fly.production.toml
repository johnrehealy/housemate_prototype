# The production worker (D-055), deployed by .github/workflows/deploy.yml after
# staging. It texts through Twilio, so it can't start until Twilio exists
# (HOU-5). Secrets are set with `fly secrets set`, never here:
#   DATABASE_URL, SUPABASE_URL, SUPABASE_SECRET_KEY, TWILIO_ACCOUNT_SID,
#   TWILIO_AUTH_TOKEN, TWILIO_MESSAGING_SERVICE_SID, TEAM_ALERT_PHONES
app = "housemate-worker-production"
# Seattle, the nearest region to the Supabase projects in us-west-2.
primary_region = "sea"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  APP_ENV = "production"
  SMS_PROVIDER = "twilio"
  ACK_REPLY_ENABLED = "false"
  # Twilio's status callbacks come back to the web app here.
  PUBLIC_BASE_URL = "https://myhousemate.co"
  PORT = "8080"

# No public service: the worker takes jobs off the database's queues and has
# nothing to serve. The health check runs on the machine's private network.
[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    method = "get"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
