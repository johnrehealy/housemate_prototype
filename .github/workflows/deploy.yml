# Every merge to main: staging first, then production, each database before
# its worker (D-055). Production waits for staging to succeed. Vercel deploys
# the web app from GitHub by itself: main to production, every other branch to
# a preview that runs against staging.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through a migration.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Staging
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      fly-config: apps/worker/fly.staging.toml
    secrets: inherit

  production:
    name: Production
    needs: staging
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      fly-config: apps/worker/fly.production.toml
    secrets: inherit
